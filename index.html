<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PlayOn 85 Hall of Fame</title>
    <meta
      name="description"
      content="Post-race Hall of Fame for PlayOn 85 at ITB Ultra Marathon 2026, Jakarta–Bandung."
    />
    <link rel="icon" href="assets/favicon.png?v=2" type="image/png" />
    <link rel="icon" href="favicon.ico?v=2" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="PlayOn 85 Hall of Fame" />
    <meta property="og:title" content="PlayOn 85 Hall of Fame" />
    <meta
      property="og:description"
      content="Post-race Hall of Fame for PlayOn 85 at ITB Ultra Marathon 2026, Jakarta–Bandung."
    />
    <meta property="og:url" content="https://primayuda.github.io/halloffameplayon/" />
    <meta property="og:image" content="https://primayuda.github.io/halloffameplayon/assets/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="PlayOn 85" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://primayuda.github.io/halloffameplayon/assets/og.png" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' https:; style-src 'self'; script-src 'self'; base-uri 'none'; object-src 'none'; frame-ancestors 'none'"
    />
    <script src="js/theme.js"></script>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <header class="hero">
      <div class="theme-row">
        <button type="button" class="theme-toggle" id="theme-toggle" aria-pressed="true">
          <span class="visually-hidden">Switch to light mode</span>
          <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true">
            <path
              fill="currentColor"
              d="M9.528 1.718a.75.75 0 0 1 .162.819A8.97 8.97 0 0 0 9 6a9 9 0 0 0 9 9 8.97 8.97 0 0 0 3.463-.69.75.75 0 0 1 .981.98 10.503 10.503 0 0 1-9.694 6.46c-5.799 0-10.5-4.701-10.5-10.5 0-4.368 2.667-8.112 6.46-9.694a.75.75 0 0 1 .818.162z"
            />
          </svg>
          <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="4" fill="currentColor" />
            <g stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <path d="M12 2.5v2.2M12 19.3v2.2M4.7 4.7l1.6 1.6M17.7 17.7l1.6 1.6M2.5 12h2.2M19.3 12h2.2M4.7 19.3l1.6-1.6M17.7 6.3l1.6-1.6" />
            </g>
          </svg>
        </button>
      </div>
      <img
        class="logo logo-playon"
        src="assets/logos/playon85.png"
        alt="PlayOn 85"
      />
      <h1>Hall of Fame</h1>
      <p class="motto">Run for our future generation</p>
      <div class="logo-row">
        <img
          class="logo logo-elephant"
          src="assets/logos/elephant.png"
          alt="ITB 85 Ultra Marathon, Jakarta to Bandung"
        />
        <img
          class="logo logo-itb"
          src="assets/logos/itb-ultra.png"
          alt="ITB Ultra Marathon 2026"
        />
      </div>
      <div class="hero-links">
        <a
          class="photo-link"
          href="https://photos.app.goo.gl/wH6TLBaq8RdcZBXQA"
          target="_blank"
          rel="noopener noreferrer"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path
              fill="currentColor"
              d="M9 3h6l1.2 2H19a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h2.8L9 3zm3 5.2A4.3 4.3 0 1 0 16.3 12 4.3 4.3 0 0 0 12 8.2zm0 1.8a2.5 2.5 0 1 1-2.5 2.5A2.5 2.5 0 0 1 12 10z"
            />
          </svg>
          Photo collection
        </a>
      </div>
    </header>
    <main>
      <section id="ketua" class="ketua" aria-label="Ketua and chief of the mission"></section>
      <div class="toolbar">
        <div class="search">
          <label>
            <span class="visually-hidden" id="search-label">Search runner or team support</span>
            <input
              id="runner-search"
              type="search"
              placeholder="Search runner or team support"
              autocomplete="off"
              spellcheck="false"
              enterkeyhint="search"
              aria-labelledby="search-label"
            />
          </label>
        </div>
        <nav class="filters" aria-label="Show">
          <button type="button" data-filter="All" aria-pressed="true">All</button>
          <button type="button" data-filter="R16" aria-pressed="false">R16</button>
          <button type="button" data-filter="R8" aria-pressed="false">R8</button>
          <button type="button" data-filter="R4" aria-pressed="false">R4</button>
          <button type="button" data-filter="TS" aria-pressed="false" aria-label="Team Support">TS</button>
        </nav>
      </div>
      <section id="roster" class="roster" aria-live="polite" aria-label="Runners"></section>
      <section id="support" class="support" aria-label="Team Support">
        <h2 class="group-title">Team Support</h2>
        <div id="support-roster" class="roster"></div>
      </section>
    </main>
    <dialog id="reflection-dialog" aria-labelledby="dialog-name">
      <div class="dialog-sheet">
        <div class="dialog-heading">
          <div id="dialog-photo"></div>
          <div class="dialog-title">
            <h2 id="dialog-name"></h2>
            <p id="dialog-badge" class="badge"></p>
            <p id="dialog-time" class="finish-time" hidden></p>
            <p id="dialog-leg" class="leg" hidden></p>
            <a id="dialog-strava" class="strava-link" hidden>Strava</a>
          </div>
          <button type="button" class="dialog-close" id="dialog-close">Close</button>
        </div>
        <div class="reflection-scroll">
          <div id="dialog-reflection"></div>
        </div>
      </div>
    </dialog>
    <button type="button" class="to-top" id="to-top" hidden>
      <span class="visually-hidden">Return to top</span>
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path
          fill="none"
          stroke="currentColor"
          stroke-width="2.2"
          stroke-linecap="round"
          stroke-linejoin="round"
          d="M12 19V6M6.5 11.5 12 6l5.5 5.5"
        />
      </svg>
    </button>
    <script src="js/app.js"></script>
  </body>
</html>
